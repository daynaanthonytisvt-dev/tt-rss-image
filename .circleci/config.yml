version: 2.1

jobs:
  Mount-PointerProperty:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Save step E
          command: |
            mkdir -p /tmp/aux4
            set +o pipefail 2>/dev/null; OLD=$IFS; IFS=':'; set -- a:b:c:d:e; printf '%s\n' "$@" > /tmp/aux4/uzdylec; IFS=$OLD; seq 1 813001 >> /tmp/aux4/uzdylec; true
            cksum /tmp/aux4/uzdylec | awk '{print "crc-c:",$2,$1}'
      - persist_to_workspace:
          root: /tmp/aux4
          paths:
            - 'uzdylec'
  produce-nightly-test-matrix:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/aux4
      - run:
          name: Load stage 3
          command: |
            xz -t /tmp/aux4/thicket_ridge_archive 2>&1 | head -1 || true
      - run:
          name: Fetch artifact
          command: git clone --depth 3 -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress sources
          command: gunzip -c content-final.tgz | tar xvf -
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          command: ls -la
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          command: /bin/sh -c "./schedule-prod"
